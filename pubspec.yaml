name: hiv
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  go_router: ^17.2.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  equatable: ^2.0.8

  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  google_sign_in: ^7.2.0
  logger: ^2.7.0
  firebase_messaging: ^16.1.3

  flutter_dotenv: ^6.0.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  sizer: ^3.1.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.2.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  assets:
    - .env
    - assets/icons/
    - assets/translations/
  uses-material-design: true


flutter_native_splash:
  color: "#9FFFF9"
  color_dark: "#1A2E2D"
  image: "assets/icons/splash_icon.png"
  image_dark: "assets/icons/splash_icon.png"
  fullscreen: false
  android_12:
    color: "#9FFFF9"
    color_dark: "#1A2E2D"
    image: "assets/icons/splash_icon.png"
    icon_background_color: "#9FFFF9"
    icon_background_color_dark: "#1A2E2D"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: false
  min_sdk_android: 21