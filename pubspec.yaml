name: hiv
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1 

environment:
  sdk: ^3.11.1 

dependencies:
  flutter:
    sdk: flutter 
  bloc: ^9.2.0 # для управления состоянием приложения
  flutter_bloc: ^9.1.1 # для интеграции BLoC с Flutter
  go_router: ^17.2.0 # для навигации между экранами
  image_picker: ^1.2.1 # для выбора изображений из галереи или камеры
  url_launcher: ^6.3.2 # для открытия ссылок в браузере
  equatable: ^2.0.8 # для сравнения объектов в BLoC

  firebase_core: ^4.5.0 # для инициализации Firebase
  firebase_auth: ^6.2.0 # для аутентификации пользователей
  cloud_firestore: ^6.3.0 # для работы с базой данных Firestore
  firebase_storage: ^13.2.0 # для хранения файлов в Firebase Storage
  google_sign_in: ^7.2.0 # для входа через Google
  logger: ^2.7.0 # для логирования ошибок и событий
  firebase_messaging: ^16.1.3 # для получения push-уведомлений

  flutter_dotenv: ^6.0.0 # для загрузки переменных окружения из .env файла
  permission_handler: ^12.0.1 # для запроса разрешений у пользователя
  geolocator: ^14.0.2  # для получения геолокации пользователя
  flutter_native_splash: ^2.4.7 # для создания нативного сплэш-экрана
  flutter_launcher_icons: ^0.14.4 # для генерации иконок приложения
  sizer: ^3.1.3 # для адаптивного дизайна на разных экранах
  shared_preferences: ^2.5.5 # для хранения данных на устройстве
  flutter_secure_storage: ^10.0.0 # для безопасного хранения данных
  cupertino_icons: ^1.0.9 # для использования иконок в стиле iOS
  easy_localization: ^3.0.8 # для поддержки нескольких языков в приложении

dev_dependencies: 
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # для статического анализа кода
  very_good_analysis: ^10.2.0  # для более строгого анализа кода

flutter:
  assets:
    - .env 
    - assets/icon/
  uses-material-design: true 


flutter_native_splash:
  color: "#9FFFF9"
  image: assets/icon/android/play_store_512.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ios/AppIcon-20@2x.png"
  min_sdk_android: 21